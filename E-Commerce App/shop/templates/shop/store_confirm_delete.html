{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
    <h1>Delete Store</h1>
    <p>Are you sure you want to delete <strong>{{ store.name }}</strong>?
    Deleting this store will also delete all its products.</p>
    <form method="post">
        {% csrf_token %}
        <button class="danger-button" type="submit">Delete Store</button>
        <a href="{% url 'vendor_dashboard' %}">Cancel</a>
    </form>
</section>
{% endblock %}
